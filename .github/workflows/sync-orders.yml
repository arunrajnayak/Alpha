name: Zerodha Daily Sync

on:
  schedule:
    # Run at 03:15 UTC (8:45 AM IST) every Monday through Friday (pre-market login & token refresh)
    - cron: '15 3 * * 1-5'
    # Run at 10:15 UTC (3:45 PM IST) every Monday through Friday (after 3:40 PM closing auction)
    - cron: '15 10 * * 1-5'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Generate Prisma Client
      run: npx prisma generate

    - name: Run Sync Script
      env:
        # Database must match src/lib/db.ts expectation
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        
        # Zerodha Credentials
        ZERODHA_USER_ID: ${{ secrets.ZERODHA_USER_ID }}
        ZERODHA_PASSWORD: ${{ secrets.ZERODHA_PASSWORD }}
        ZERODHA_TOTP_SECRET: ${{ secrets.ZERODHA_TOTP_SECRET }}
        ZERODHA_API_KEY: ${{ secrets.ZERODHA_API_KEY }}
        ZERODHA_API_SECRET: ${{ secrets.ZERODHA_API_SECRET }}
        
        # Next.js Revalidation + Recompute
        NEXT_APP_URL: ${{ secrets.NEXT_APP_URL }}
        CRON_SECRET: ${{ secrets.CRON_SECRET }}
      run: |
        npx tsx src/scripts/zerodha-cron.ts
