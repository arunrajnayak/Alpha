name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Node.js setup ───────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # Suppress Puppeteer download in CI (not needed for Android build)
          PUPPETEER_SKIP_DOWNLOAD: true

      # ── Next.js static export ───────────────────────────────────────────────
      - name: Build Next.js (static export)
        run: npm run build
        env:
          # Provide dummy values so the build doesn't fail on missing env vars
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'libsql://placeholder.turso.io' }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN || 'placeholder' }}
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN || 'placeholder' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET || 'placeholder' }}
          NEXT_PUBLIC_APP_ENV: production

      # ── Capacitor sync ──────────────────────────────────────────────────────
      - name: Sync Capacitor to Android
        run: npx cap sync android

      # ── Java / Android SDK ──────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ── Keystore (optional — only for signed release builds) ────────────────
      # To enable signing, add these secrets in GitHub repo settings:
      #   ANDROID_KEYSTORE_BASE64, ANDROID_KEY_ALIAS,
      #   ANDROID_KEY_PASSWORD, ANDROID_STORE_PASSWORD
      - name: Decode keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks

      - name: Write keystore properties
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          cat >> android/gradle.properties <<EOF
          KEYSTORE_PATH=keystore.jks
          KEY_ALIAS=$ANDROID_KEY_ALIAS
          KEY_PASSWORD=$ANDROID_KEY_PASSWORD
          STORE_PASSWORD=$ANDROID_STORE_PASSWORD
          EOF

      # ── Gradle build ────────────────────────────────────────────────────────
      - name: Make Gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # ── Upload artifact ─────────────────────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: alpha-portfolio-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
